<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>水生植物環境因子模擬｜NDS點陣預覽版</title>
  <style>
    :root{--ink:#173d37;--muted:#60756e;--green:#237963;--deep:#155849;--paper:#fffdf2;--line:#c9dfd5;--orange:#dda20b;--warn:#d65f46}
    *{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#dcece5}button,input{font:inherit}button{cursor:pointer}
    .app{min-height:100vh;background:radial-gradient(circle at 12% 0,#fff 0,transparent 28%),linear-gradient(145deg,#edf6ee,#d8e9ed 60%,#efe5c6)}

    main{max-width:1200px;margin:auto;padding:0 18px 25px;display:grid;gap:13px}.panel{background:rgba(255,253,242,.96);border:1px solid rgba(35,121,99,.17);border-radius:18px;box-shadow:0 14px 40px rgba(23,62,54,.11);overflow:hidden}

<body><div class="app">
  <header><div><div class="kicker">自然科互動教材 · NDS PIXEL PREVIEW</div><h1 class="title">水生植物如何回應水位與水流？</h1></div><p class="sub">使用原生尺寸點陣畫布呈現植物構造。調整環境因子，觀察固定方式、柔軟度與枝條長度造成的差異。</p></header>
  <main>
    <section class="panel controls"><div class="slider-row">
      <div class="control"><label for="water">水位 <span class="value" id="waterValue">中水位 50</span></label><input id="water" type="range" min="0" max="100" value="50"><div class="ticks"><span>低</span><span>中</span><span>高</span></div></div>
      <div class="control"><label for="flow">水流 <span class="value" id="flowValue">緩流 28</span></label><input id="flow" type="range" min="0" max="100" value="28"><div class="ticks"><span>靜水</span><span>緩流</span><span>極強</span></div></div>
    </div><div class="plant-tabs"><button class="plant active" data-plant="emergent">挺水</button><button class="plant" data-plant="floatingLeaf">浮葉</button><button class="plant" data-plant="submerged">沉水</button><button class="plant" data-plant="freeFloating">漂浮</button></div></section>
    <div class="content">
      <section class="panel"><div class="stage-head"><strong>環境因子觀察窗</strong><span class="status" id="status">環境穩定</span></div><div class="screen"><canvas id="scene" width="640" height="400"></canvas><div class="scene-label" id="sceneLabel">挺水植物較硬挺，緩流下大致直立。</div></div><div class="legend"><span><i style="background:#69c3c5"></i>水面</span><span><i style="background:#d9f7f1"></i>水流</span><span><i style="background:#438a4b"></i>植物</span><span><i style="background:#d65f46"></i>折裂</span></div><div class="teacher">教學提示：一次只改變一個條件。先說出植物哪裡移動，再解釋它是否固定、柔軟，以及枝條長度是否足夠。</div></section>
      <aside><section class="panel box lesson"><h2>觀察與機制</h2><div class="lesson-title" id="lessonTitle"></div><p id="observation"></p><p class="mechanism" id="mechanism"></p><div class="meter"><span>環境壓力</span><div class="bar"><span id="stressBar"></span></div><b id="stressText">低</b></div></section>
      <section class="panel box"><h2>動畫控制</h2><div class="control time-control"><label for="time">觀察時間 <span class="value" id="timeValue">50</span></label><input id="time" type="range" min="0" max="100" value="50"><div class="ticks"><span>前段</span><span>中段</span><span>後段</span></div></div><div class="actions"><button id="pause">暫停動畫</button><button id="reset">重置</button></div></section>
      <div class="panel spec">點陣規格：640×400 原生畫布、整數座標、有限色盤、深色輪廓與最近鄰放大。沒有載入外部大圖，因此不會因縮圖取樣而破碎。</div></aside>
    </div>
  </main>
</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];ctx.imageSmoothingEnabled=false;
const ui={water:$('#water'),flow:$('#flow'),time:$('#time'),waterValue:$('#waterValue'),flowValue:$('#flowValue'),timeValue:$('#timeValue'),status:$('#status'),sceneLabel:$('#sceneLabel'),lessonTitle:$('#lessonTitle'),observation:$('#observation'),mechanism:$('#mechanism'),stressBar:$('#stressBar'),stressText:$('#stressText'),pause:$('#pause')};
const state={plant:'emergent',water:50,flow:28,time:50,phase:0,running:true,last:0,freeX:.27},W=640,H=400,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const info={emergent:{title:'挺水植物｜較硬挺、根固定在泥中',mechanism:'莖具有較高支撐力，會先彎曲；當水流達到模擬臨界值 88，部分莖可能折裂。'},floatingLeaf:{title:'浮葉植物｜葉柄長度近似固定',mechanism:'根固定在泥中。低水位時葉柄可向外平展；高水位時較多長度用於向上，葉片因此聚集，過深時會沉入水中。'},submerged:{title:'沉水植物｜柔軟枝葉留在水中',mechanism:'枝葉會順流降低阻力。低水位時頂端不穿出水面，而在水面下方轉向並近似水平延伸。'},freeFloating:{title:'漂浮植物｜整株沒有固定在底泥',mechanism:'植株停在水面，根懸垂水中；水流除了使根擺動，也會帶動整株往下游漂移。'}};
const C={sky1:'#b9e1df',sky2:'#e9e2bd',hill:'#839c69',hill2:'#6f8d5e',water1:'#5bb9bc',water2:'#2f8495',surface:'#d9f7f1',mud:'#756448',mud2:'#5f533f',outline:'#214b39',stem:'#3e8445',stemHi:'#73b35c',leaf:'#4f9c50',leafHi:'#8acb68',root:'#51422f',grain:'#aa7a48',warn:'#d65f46'};
function waterName(v){return v<34?'低水位':v<67?'中水位':'高水位'}function flowName(v){return v<20?'靜水':v<65?'緩流':v<88?'急流':'極強水流'}
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function line(ps,c,w=3){ctx.beginPath();ctx.moveTo(Math.round(ps[0].x),Math.round(ps[0].y));for(let i=1;i<ps.length;i++)ctx.lineTo(Math.round(ps[i].x),Math.round(ps[i].y));ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='square';ctx.lineJoin='round';ctx.stroke()}
function ell(x,y,rx,ry,c,stroke=C.outline,a=0){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(a);ctx.fillStyle=c;ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}
function leaf(x,y,rx,ry,a=0,c=C.leaf){ell(x,y,rx,ry,c,C.outline,a);line([{x:x-rx*.55,y},{x:x+rx*.55,y}],C.leafHi,1)}
function roots(x,y,n=7,len=27){for(let i=0;i<n;i++)line([{x,y},{x:x+(i-(n-1)/2)*5+Math.sin(state.phase+i)*2,y:y+len+(i%3)*3}],C.root,2)}
function dims(){return{waterY:282-state.water*1.58,mudY:340}}
function background(d){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.sky1);g.addColorStop(1,C.sky2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=C.hill;ctx.beginPath();ctx.moveTo(0,240);for(let x=0;x<=W;x+=20)ctx.lineTo(x,226+Math.round(Math.sin(x*.035)*9));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle=C.hill2;for(let x=0;x<W;x+=8)if((x/8)%3===0)px(x,235+(x%17),4,2,C.hill2);g=ctx.createLinearGradient(0,d.waterY,0,H);g.addColorStop(0,C.water1);g.addColorStop(1,C.water2);ctx.fillStyle=g;ctx.fillRect(0,d.waterY,W,H-d.waterY);for(let y=Math.ceil(d.waterY/4)*4;y<d.mudY;y+=8)for(let x=(y%16);x<W;x+=16)px(x,y,3,2,'rgba(204,239,226,.14)');px(0,d.mudY,W,H-d.mudY,C.mud);for(let y=d.mudY+6;y<H;y+=9)for(let x=(y%13);x<W;x+=17)px(x,y,4,2,(x+y)%34?C.mud2:'#907953');ctx.strokeStyle=C.surface;ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=W;x+=4){const y=Math.round(d.waterY+Math.sin(x*.045+state.phase)*1.5);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();flow(d)}
function flow(d){ctx.save();ctx.beginPath();ctx.rect(0,d.waterY,W,H-d.waterY);ctx.clip();const n=state.flow<10?6:18,s=.25+state.flow*.025;for(let i=0;i<n;i++){const y=d.waterY+12+(i*19%(H-d.waterY-18)),x=((i*71+state.phase*45*s)%(W+60))-40;line([{x,y},{x:x+10+state.flow*.24,y}],C.surface,1+Math.floor(state.flow/40))}ctx.restore()}
function chain(x,y,segs,len,soft,ceiling=null,seed=0){const p=[{x,y}];let a=-Math.PI/2;for(let i=0;i<segs;i++){a+=state.flow*.0008*soft*(i+1)+Math.sin(state.phase*1.6+i+seed)*.018*soft;let nx=x+Math.cos(a)*len,ny=y+Math.sin(a)*len;if(ceiling!==null&&ny<ceiling){ny=ceiling+Math.sin(state.phase+i)*1.5;nx=x+Math.sqrt(Math.max(0,len*len-(ny-y)*(ny-y)))}p.push({x:nx,y:ny});x=nx;y=ny}return p}
function diamondLeaf(x,y,s,a=0,c=C.leaf){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(a);ctx.fillStyle=c;ctx.strokeStyle=C.outline;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-s*.62);ctx.lineTo(s,0);ctx.lineTo(0,s*.62);ctx.lineTo(-s,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle=C.leafHi;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-s*.55,0);ctx.lineTo(s*.55,0);ctx.stroke();ctx.restore()}
function caltropFruit(x,y,s=1){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.fillStyle='#6e4b2c';ctx.strokeStyle=C.outline;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-6*s);ctx.lineTo(7*s,-2*s);ctx.lineTo(14*s,-7*s);ctx.lineTo(9*s,2*s);ctx.lineTo(4*s,7*s);ctx.lineTo(0,5*s);ctx.lineTo(-4*s,7*s);ctx.lineTo(-9*s,2*s);ctx.lineTo(-14*s,-7*s);ctx.lineTo(-7*s,-2*s);ctx.closePath();ctx.fill();ctx.stroke();px(-2,-3,4,5,'#9d7042');ctx.restore()}
function toothedPad(x,y,r,a=0,c=C.leaf){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(a);ctx.beginPath();for(let i=0;i<20;i++){const ang=i*Math.PI*2/20,rr=i%2?r:r-2.5,px=Math.cos(ang)*rr,py=Math.sin(ang)*rr*.52;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.lineTo(0,0);ctx.closePath();ctx.fillStyle=c;ctx.strokeStyle=C.outline;ctx.lineWidth=2;ctx.fill();ctx.stroke();ctx.strokeStyle=C.leafHi;ctx.lineWidth=1;for(let i=1;i<9;i++){const a2=i*Math.PI*2/9;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a2)*r*.72,Math.sin(a2)*r*.36);ctx.stroke()}ctx.restore()}
function reedPanicle(x,y,s=1){line([{x,y:y+18*s},{x,y}],C.outline,5);line([{x,y:y+18*s},{x,y}],C.stem,2);for(let j=0;j<5;j++){const yy=y+j*6*s,spread=(6+j*2)*s;line([{x,y:yy},{x:x-spread,y:yy-7*s}],C.stem,2);line([{x,y:yy},{x:x+spread,y:yy-7*s}],C.stem,2);for(const sg of[-1,1])for(let k=0;k<3;k++)ell(x+sg*(5+k*3)*s,yy-(3+k*2)*s,2*s,3*s,'#9d6558',C.outline,sg*.35)}}
function reedBlade(x,y,len,width,side,seed=0){const flowPush=state.flow*.13,bob=Math.sin(state.phase+seed)*2,tip={x:x+side*len+flowPush,y:y-len*.23+bob},c1={x:x+side*len*.38+flowPush*.25,y:y-len*.42},c2={x:x+side*len*.76+flowPush*.72,y:y-len*.2};ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(c1.x-side*width,c1.y,tip.x,tip.y);ctx.quadraticCurveTo(c2.x+side*width,c2.y,x+side*width*.55,y+3);ctx.closePath();ctx.fillStyle=seed%2?'#4f9148':'#64a556';ctx.strokeStyle=C.outline;ctx.lineWidth=2;ctx.fill();ctx.stroke();ctx.strokeStyle=C.leafHi;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+1);ctx.quadraticCurveTo(c1.x,c1.y,tip.x,tip.y);ctx.stroke()}
function emergent(d){const broken=state.flow>=88;
  /* 左側蘆葦：高莖、分枝圓錐花序。 */
  [220,252,282].forEach((x,i)=>{const p=chain(x,d.mudY,7,39,.17,null,i),willBreak=broken&&i!==2,cut=willBreak?(i===0?3:4):7;roots(x,d.mudY,5,24);line(p.slice(0,cut+1),C.outline,8);line(p.slice(0,cut+1),C.stem,4);for(let n=1;n<Math.min(cut+1,6);n++){const q=p[n],sg=(n+i)%2?1:-1;reedBlade(q.x,q.y,34+n*5,4.5,sg,n+i)}if(cut===7){const t=p[7];reedPanicle(t.x,t.y-24,.82)}else{const c=p[cut];px(c.x-5,c.y-4,10,7,C.warn);px(c.x-2,c.y-1,4,2,'#f1c27d');const gap=30+(state.flow-88)*3+Math.sin(state.phase)*5,top=p.slice(cut).map((q,n)=>({x:q.x+gap+n*3,y:q.y+15+n*2}));line(top,C.outline,8);line(top,C.stem,4);top.slice(0,-1).forEach((q,n)=>reedBlade(q.x,q.y,28+n*5,4,n%2?1:-1,n+7));const t=top.at(-1);reedPanicle(t.x,t.y-25,.78)}});
  /* 右側香蒲：葉叢與褐色圓柱花序。 */
  const bx=405;roots(bx,d.mudY,7,25);for(let i=-4;i<=4;i++){const lean=i*7+state.flow*.12+Math.sin(state.phase+i)*2;line([{x:bx+i*3,y:d.mudY},{x:bx+lean*.35,y:210-Math.abs(i)*4},{x:bx+lean,y:88+Math.abs(i)*7}],C.outline,7);line([{x:bx+i*3,y:d.mudY},{x:bx+lean*.35,y:210-Math.abs(i)*4},{x:bx+lean,y:88+Math.abs(i)*7}],i%2?C.stem:C.stemHi,3)}[-16,14].forEach((dx,i)=>{const bend=state.flow*.26+i*5,topX=bx+dx+bend,topY=61+i*24;line([{x:bx+dx*.25,y:d.mudY},{x:topX,y:topY+33}],C.outline,6);line([{x:bx+dx*.25,y:d.mudY},{x:topX,y:topY+33}],C.stem,3);ell(topX,topY+15,6,22,'#5d4b2e',C.outline,.05)})}
function petiole(base,target,color='#8a653b',width=3){ctx.strokeStyle=C.outline;ctx.lineWidth=width+3;ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.quadraticCurveTo((base.x+target.x)/2+state.flow*.12,(base.y+target.y)/2+5,target.x,target.y);ctx.stroke();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function lilyPetiole(base,target,color='#826342',width=3){const lift=Math.max(20,base.y-target.y),side=target.x>=base.x?1:-1,bow=34+state.flow*.3,c1={x:base.x+state.flow*.08,y:base.y-lift*.58},c2={x:target.x-side*bow+state.flow*.16,y:target.y+lift*.13};ctx.strokeStyle=C.outline;ctx.lineWidth=width+3;ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.bezierCurveTo(c1.x,c1.y,c2.x,c2.y,target.x,target.y);ctx.stroke();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function floatingLeaf(d){

  const b1={x:70,y:d.mudY},v1=b1.y-d.waterY,max1=147,reach1=v1<=max1,lateral1=reach1?Math.sqrt(Math.max(0,max1*max1-v1*v1))*.55:10,disc={x:b1.x+lateral1+state.flow*.3,y:reach1?d.waterY+4:b1.y-max1};roots(b1.x,b1.y,3,17);petiole(b1,disc,'#6f5d35',3);ctx.globalAlpha=reach1?1:.57;ell(disc.x,disc.y+4,13,8,'#789748',C.outline,.1);for(let i=0;i<9;i++){const a=i*Math.PI*2/9+.15,len=43+(i%3)*6,flowSpread=state.flow*.08*(.65+Math.cos(a)*.35),x=disc.x+Math.cos(a)*len+flowSpread,y=disc.y+Math.sin(a)*len*.42;petiole(disc,{x,y},'#77803c',2);ell(x,y+5,6,10,'#a4b858',C.outline,a);diamondLeaf(x,y,18+(i%2),a,reach1?(i%2?C.leaf:C.leafHi):'#55786a')}for(let i=0;i<6;i++){const a=i*Math.PI*2/6+.62,len=23+(i%2)*4,x=disc.x+Math.cos(a)*len+state.flow*.05,y=disc.y+Math.sin(a)*len*.35-2;petiole(disc,{x,y},'#7d8741',2);diamondLeaf(x,y,14+(i%2),a+.15,reach1?'#75ad59':'#5b786a')}for(let r=-5;r<=5;r++)line([{x:disc.x+r*1.8,y:disc.y+7},{x:disc.x+r*2.5+Math.sin(state.phase+r)*5+state.flow*.08,y:disc.y+43+Math.abs(r)*2}],'#58a25d',1);caltropFruit(disc.x-18,disc.y+31,.52);caltropFruit(disc.x+7,disc.y+39,.6);caltropFruit(disc.x+29,disc.y+28,.46);ctx.globalAlpha=1;

function lilyFlower(x,y,s=1){for(let ring=0;ring<2;ring++)for(let i=0;i<10;i++){const a=i*Math.PI*2/10+ring*.16,r=(7+ring*3)*s;ell(x+Math.cos(a)*r,y+Math.sin(a)*r*.48,4.5*s,10*s,ring?'#fff9f5':'#eadde9','#8b718a',a+Math.PI/2)}ell(x,y,5*s,4*s,'#e0b53b','#806f2e')}
function submerged(d){
  /* 左側台灣水韭：葉片具格狀分隔與可見氣室。 */
  const bx=245,stemTop=d.mudY-13;roots(bx,d.mudY,7,19);ell(bx,d.mudY-7,10,8,'#718a48',C.outline);line([{x:bx,y:d.mudY-2},{x:bx,y:stemTop}],C.outline,6);line([{x:bx,y:d.mudY-2},{x:bx,y:stemTop}],C.stemHi,3);for(let i=-7;i<=7;i++){const ceiling=d.waterY+10+Math.abs(i%3)*2,segLen=(22+Math.abs(i%3))*.25,pts=[{x:bx+i*.35,y:stemTop}];let x=bx+i*.35,y=stemTop,a=-Math.PI/2+i*.075+state.flow*.0015;for(let n=0;n<7;n++){a+=state.flow*.00012*(n+1)+Math.sin(state.phase+i+n)*.004;let nx=x+Math.cos(a)*segLen,ny=y+Math.sin(a)*segLen;if(ny<ceiling){ny=ceiling;nx=x+Math.sqrt(Math.max(0,segLen*segLen-(ny-y)*(ny-y)))}pts.push({x:nx,y:ny});x=nx;y=ny}line(pts,C.outline,6);line(pts,i%2?'#50a64f':'#6aba58',3);for(let n=1;n<pts.length;n++){const q=pts[n];if(n%2)px(q.x-2,q.y-2,4,2,'#b6d77d');if((n+i)%4===0)ell(q.x,q.y,2,2,'#d8f3da','#5d8f71')}}

function salviniaCluster(x,y,s=1){for(let i=-2;i<=2;i++){ell(x+i*6*s,y+(i%2)*2*s,6*s,4*s,i%2?'#a4d87a':'#8dcc6e','#365f3d',i*.12);ctx.strokeStyle='#d5efaa';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+i*6*s-3*s,y+(i%2)*2*s);ctx.lineTo(x+i*6*s+3*s,y+(i%2)*2*s);ctx.stroke();line([{x:x+i*6*s,y:y+3*s},{x:x+i*7*s+Math.sin(state.phase+i)*2,y:y+18*s+Math.abs(i)*1.5}], '#806f51',1)}}
function azollaCluster(x,y,s=1,red=false){const cols=red?['#a95542','#c56b4d','#7f8e45']:['#4f984a','#67ac50','#83b65a'];for(let b=0;b<3;b++){const a=(b-1)*.6;for(let j=0;j<5;j++)ell(x+Math.cos(a)*j*4*s,y+Math.sin(a)*j*3*s,3*s,2*s,cols[(j+b)%3],C.outline,a)}}
function freeFloating(d,dt){state.freeX+=state.flow*.0000012*dt;if(state.freeX>1.19)state.freeX=-.19;const drift=W*state.freeX,y=d.waterY,groupOffsets=[0,225,450];groupOffsets.forEach((off,g)=>{const gx=((drift+off+80)%760)-60;salviniaCluster(gx-19,y-2,1.02);salviniaCluster(gx+5,y+1,.9);salviniaCluster(gx+27,y-3,.82);azollaCluster(gx-12,y-8,.64,g===1);azollaCluster(gx+11,y-9,.58,g===2);azollaCluster(gx+31,y-6,.52,g===0);azollaCluster(gx-30,y-5,.5,g===1)})}
function content(){let stress=Math.round(clamp(Math.abs(state.water-50)*.34+state.flow*.68,5,100)),obs,status;if(state.plant==='emergent'){if(state.flow>=88){obs='部分莖超過耐受值，在受力較大的位置折裂。';status='莖折裂'}else if(state.flow>=68){obs='莖明顯向下游彎曲，仍由根和莖支撐。';status='接近臨界值'}else{obs='莖輕微擺動，主要部分仍保持直立。';status='環境穩定'}}if(state.plant==='floatingLeaf'){const deep=state.water>82;obs=deep?'水深超過部分葉柄可達距離，葉片聚集並沉水。':state.water<35?'葉柄長度大致不變，葉片離根部中心較遠。':'較多葉柄長度用於向上，葉片較集中。';status=deep?'部分淹沒':'葉片浮水'}if(state.plant==='submerged'){obs=state.water<35?'頂端到達水面下方後轉向，近似平行水面延伸。':state.flow>65?'柔軟枝葉明顯順著水流搖曳。':'枝葉在水中輕柔擺動。';status=state.water<35?'貼近水面':'柔軟順流'}if(state.plant==='freeFloating'){obs=state.flow>55?'整株沒有底泥固定，持續往下游漂移。':'植株浮在水面，懸垂根輕微擺動。';status=state.flow>55?'快速漂移':'緩慢漂移'}ui.status.textContent=status;ui.sceneLabel.textContent=obs;ui.lessonTitle.textContent=info[state.plant].title;ui.observation.textContent='觀察：'+obs;ui.mechanism.textContent='機制：'+info[state.plant].mechanism;ui.stressBar.style.width=stress+'%';ui.stressText.textContent=stress<35?'低':stress<70?'中':'高';ui.waterValue.textContent=`${waterName(state.water)} ${state.water}`;ui.flowValue.textContent=`${flowName(state.flow)} ${state.flow}`;ui.timeValue.textContent=state.time}
function frame(t){const dt=Math.min(40,t-state.last||16);state.last=t;if(state.running){state.phase+=dt*.0015;state.time=(state.time+dt*.012)%101;ui.time.value=Math.round(state.time);ui.timeValue.textContent=Math.round(state.time)}const d=dims();ctx.clearRect(0,0,W,H);background(d);if(state.plant==='emergent')emergent(d);if(state.plant==='floatingLeaf')floatingLeaf(d);if(state.plant==='submerged')submerged(d);if(state.plant==='freeFloating')freeFloating(d,state.running?dt:0);requestAnimationFrame(frame)}
