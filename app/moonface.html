<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>日月地模擬實驗｜離線教師版</title>
  <style>:root {
  --ink: #15243a;
  --muted: #64748b;
  --line: #d9e4ef;
  --panel: rgba(255, 255, 255, 0.92);
  --blue: #2563eb;
  --indigo: #4f46e5;
  --amber: #d97706;
  --shadow: 0 24px 60px rgba(19, 43, 69, 0.12);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 7% 3%, rgba(113, 194, 255, 0.22), transparent 28rem),
    radial-gradient(circle at 94% 10%, rgba(142, 125, 255, 0.13), transparent 30rem),
    #eef5fa;
  color: var(--ink);
  font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
}

button,
input {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 3px solid rgba(37, 99, 235, 0.36);
  outline-offset: 2px;
}

.app-shell {
  width: min(1840px, 100%);
  margin: 0 auto;
  padding: 14px clamp(14px, 2vw, 32px) 64px;
}

.app-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  margin-bottom: 10px;
}

.app-header h1 {
  margin: 2px 0 6px;
  font-size: clamp(2rem, 3vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.04em;
}

.app-header p:not(.eyebrow) {
  margin: 0;
  color: var(--muted);
  font-size: 1rem;
}

.eyebrow {
  margin: 0;
  color: #557493;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.header-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
}

.science-badge,
.model-chip,
.phase-pill,
.record-count {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 7px 12px;
  border: 1px solid rgba(88, 122, 155, 0.22);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  color: #37536f;
  font-size: 0.78rem;
  font-weight: 700;
  backdrop-filter: blur(14px);
}

.ghost-button,
.mini-button,
.record-actions button,
.hour-step-buttons button,
.export-buttons button,
.text-button,
.phase-presets button,
.season-presets button,
.view-switch button,
.collapse-button {
  cursor: pointer;
  border: 1px solid #cbd9e5;
  border-radius: 12px;
  background: #fff;
  color: #27405a;
  font-weight: 700;
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}

.ghost-button {
  padding: 10px 15px;
}

button:not(:disabled):hover,
.offline-link:hover {
  transform: translateY(-1px);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.46;
}

.observation-section,
.control-panel,
.space-card,
.records-card,
.export-card,
.model-note {
  border: 1px solid rgba(114, 144, 172, 0.22);
  border-radius: 26px;
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
}

.observation-section {
  padding: 13px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 14px;
}

.section-heading h2 {
  margin: 2px 0 0;
  font-size: 1.3rem;
  letter-spacing: -0.02em;
}

.compact-heading {
  margin-bottom: 12px;
}

.live-readout {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  text-align: right;
}

.live-readout span {
  color: #41688b;
  font-size: 0.82rem;
  font-weight: 800;
}

.live-readout strong {
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.92rem;
}

.live-readout small {
  color: #71859a;
  font-size: 0.68rem;
  font-weight: 700;
}

.observation-tools {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
}

.display-switches {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  flex-wrap: wrap;
}

.moon-size-switch button {
  padding-inline: 10px;
}

.view-switch {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid #d5e0e9;
  border-radius: 13px;
  background: #edf3f7;
}

.view-switch button {
  min-height: 34px;
  padding: 6px 12px;
  border-color: transparent;
  background: transparent;
  box-shadow: none;
  font-size: 0.76rem;
}

.view-switch button.active {
  border-color: #cad8e5;
  background: #fff;
  color: #214b75;
  box-shadow: 0 4px 12px rgba(34, 68, 98, 0.1);
}

.linked-time-note {
  margin: 8px 0 0;
  color: #7a6a4e;
  font-size: 0.68rem;
  line-height: 1.5;
}

.chart-shell {
  overflow: hidden;
  border-radius: 18px;
  background: #07111f;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}

.chart-scroll {
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scrollbar-color: #8298ad #dce7ef;
}

.sky-chart {
  display: block;
  width: 100%;
  min-width: 960px;
  height: auto;
  aspect-ratio: 8 / 3;
}

.mobile-landscape-note {
  display: none;
  margin: 0 0 10px;
  padding: 8px 11px;
  border-radius: 10px;
  background: #eaf4ff;
  color: #31597d;
  font-size: 0.78rem;
}

.workspace-grid {
  display: block;
  margin-top: 20px;
}

.control-panel {
  position: sticky;
  top: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px;
}

.floating-controls {
  position: fixed;
  top: auto;
  right: 22px;
  bottom: 22px;
  z-index: 60;
  width: min(370px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  overflow: auto;
  padding: 14px;
  box-shadow: 0 24px 70px rgba(5, 20, 38, 0.28);
}

.drag-handle {
  margin: -4px -3px 8px;
  padding: 5px 3px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.drag-handle:active {
  cursor: grabbing;
}

.control-heading-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
}

.drag-hint {
  color: #8193a4;
  font-size: 0.65rem;
  white-space: nowrap;
}

.collapse-button {
  min-height: 31px;
  padding: 5px 8px;
  font-size: 0.7rem;
}

.control-panel-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.floating-controls.is-collapsed {
  width: min(340px, calc(100vw - 32px));
  overflow: hidden;
}

.floating-controls.is-collapsed .control-panel-body {
  display: none;
}

.phase-pill {
  border-color: rgba(79, 70, 229, 0.25);
  background: #eef2ff;
  color: #4338ca;
}

.control-card {
  padding: 15px;
  border: 1px solid #dae4ed;
  border-radius: 18px;
  background: #f8fafc;
}

.indigo-card {
  background: linear-gradient(145deg, #f8f8ff, #f2f4ff);
}

.season-card {
  background: linear-gradient(145deg, #f1fbf8, #edf8f6);
}

.season-presets {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.season-presets button {
  min-height: 35px;
  padding: 6px 3px;
  font-size: 0.74rem;
}

.season-presets button.active {
  border-color: #2f7c72;
  background: #dff4ee;
  color: #155e55;
  box-shadow: inset 0 0 0 1px rgba(47, 124, 114, 0.16);
}

.scenario-note {
  margin: 8px 0 0;
  color: #668078;
  font-size: 0.66rem;
  line-height: 1.45;
}

.amber-card {
  background: linear-gradient(145deg, #fffaf3, #fff7e8);
}

.record-card {
  background: linear-gradient(145deg, #f2fbfb, #f5fafc);
}

.control-title-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}

.control-card-heading-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  min-width: 0;
}

.card-collapse-button {
  min-height: 28px;
  padding: 4px 7px;
  border-color: rgba(120, 144, 165, 0.28);
  background: rgba(255, 255, 255, 0.68);
  color: #587087;
  font-size: 0.66rem;
}

.control-card.is-collapsed {
  padding-block: 11px;
}

.control-card.is-collapsed .control-title-row {
  margin-bottom: 0;
}

.control-card.is-collapsed .control-card-content {
  display: none;
}

.control-title-row label {
  font-size: 0.88rem;
  font-weight: 800;
}

.control-title-row strong {
  color: #334d68;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
}

.control-title-row span {
  color: var(--muted);
  font-size: 0.72rem;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--indigo);
}

.amber-card input[type="range"] {
  accent-color: var(--amber);
}

input[type="number"],
input[type="time"],
input[type="text"] {
  width: 100%;
  min-height: 42px;
  padding: 9px 11px;
  border: 1px solid #cbd9e5;
  border-radius: 11px;
  background: #fff;
  color: var(--ink);
}

.inline-input-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin-top: 10px;
}

.hour-step-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.hour-step-buttons button {
  min-height: 38px;
  padding: 7px 9px;
  font-size: 0.78rem;
}

.mini-button {
  padding: 8px 11px;
  white-space: nowrap;
}

.phase-presets {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 9px;
}

.phase-presets button {
  padding: 7px 4px;
  font-size: 0.76rem;
}

.primary-button {
  border-color: transparent !important;
  background: linear-gradient(135deg, #315fcb, #4f46e5) !important;
  color: #fff !important;
  box-shadow: 0 10px 24px rgba(63, 76, 192, 0.2);
}

.record-button {
  width: 100%;
  min-height: 46px;
  margin-top: 10px;
  border: 0;
  border-radius: 13px;
  font-weight: 800;
}

.record-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.record-actions button {
  padding: 8px;
  font-size: 0.78rem;
}

.right-column {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(320px, 0.8fr);
  gap: 20px;
}

.inline-space-view .space-card {
  border: 0;
  border-radius: 18px;
  box-shadow: none;
}

.inline-space-view .space-svg {
  max-height: 520px;
}

.space-card,
.records-card,
.export-card {
  padding: 18px;
}

.space-card {
  grid-column: 1 / -1;
}

.model-chip {
  min-height: 30px;
  padding: 5px 10px;
  background: #eef6fb;
  font-size: 0.7rem;
}

.space-svg {
  display: block;
  width: 100%;
  max-height: 330px;
  border-radius: 18px;
}

.record-count {
  min-height: 28px;
  padding: 4px 10px;
  font-size: 0.72rem;
}

.record-table-wrap {
  max-height: 290px;
  overflow: auto;
  border: 1px solid #dce6ee;
  border-radius: 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
}

th,
td {
  padding: 9px 10px;
  border-bottom: 1px solid #e4ebf1;
  text-align: left;
  white-space: nowrap;
}

th {
  position: sticky;
  top: 0;
  background: #f1f6f9;
  color: #456078;
  font-size: 0.7rem;
}

.empty-state {
  display: grid;
  min-height: 132px;
  place-items: center;
  padding: 20px;
  border: 1px dashed #b8cad8;
  border-radius: 15px;
  background: #f7fafc;
  color: #6a8298;
  font-size: 0.86rem;
  line-height: 1.7;
  text-align: center;
}

.text-button {
  padding: 7px 10px;
  color: #3d5d7a;
  font-size: 0.72rem;
}

.export-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 12px;
  padding: 12px;
  border-radius: 14px;
  background: #f3f7fa;
}

.export-options label {
  display: flex;
  gap: 7px;
  align-items: center;
  color: #3f566d;
  font-size: 0.75rem;
}

.export-options input {
  accent-color: var(--blue);
}

.export-buttons {
  display: grid;
  gap: 8px;
}

.export-buttons button {
  min-height: 42px;
  padding: 8px 12px;
}

.offline-link {
  display: flex;
  justify-content: center;
  margin-top: 10px;
  padding: 9px;
  border-radius: 11px;
  color: #385873;
  font-size: 0.75rem;
  font-weight: 700;
  text-decoration: none;
  transition: transform 160ms ease;
}

.model-note {
  display: grid;
  grid-template-columns: minmax(240px, 0.7fr) minmax(0, 1.8fr);
  gap: 26px;
  margin-top: 20px;
  padding: 22px;
}

.model-note h2 {
  margin: 4px 0 0;
  font-size: 1.25rem;
}

.model-note-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.model-note-grid p {
  margin: 0;
  color: #526b81;
  font-size: 0.83rem;
  line-height: 1.75;
}

.image-credit {
  grid-column: 2;
  margin: -10px 0 0;
  color: #8293a4;
  font-size: 0.68rem;
}

.error-message {
  margin: 8px 0 0;
  color: #b91c1c;
  font-size: 0.82rem;
}

.observation-section:fullscreen {
  display: flex;
  flex-direction: column;
  padding: 10px;
  background: #020711;
}

.observation-section:fullscreen .section-heading {
  color: #f8fafc;
}

.observation-section:fullscreen .chart-shell,
.observation-section:fullscreen .chart-scroll {
  width: 100%;
  max-height: 100vh;
}

.observation-section:fullscreen .sky-chart {
  width: 100%;
  min-width: 0;
  max-height: calc(100vh - 92px);
  object-fit: contain;
}

@media (max-width: 1100px) {
  .floating-controls {
    position: static;
    left: auto !important;
    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    width: 100%;
    max-height: none;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    overflow: visible;
  }

  .floating-controls > .section-heading,
  .floating-controls > .control-panel-body {
    grid-column: 1 / -1;
  }

  .drag-hint {
    display: none;
  }

  .drag-handle {
    cursor: default;
    touch-action: auto;
  }
}

@media (max-width: 760px) {
  .app-shell {
    padding-inline: 12px;
  }

  .app-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .header-actions {
    justify-content: flex-start;
  }

  .observation-section,
  .control-panel,
  .space-card,
  .records-card,
  .export-card,
  .model-note {
    border-radius: 20px;
  }

  .observation-section {
    padding: 12px;
  }

  .section-heading {
    align-items: flex-start;
  }

  .observation-tools {
    align-items: flex-end;
    flex-direction: column-reverse;
    gap: 7px;
  }

  .display-switches {
    justify-content: flex-end;
  }

  .mobile-landscape-note {
    display: block;
  }

  .sky-chart {
    width: 960px;
  }

  .floating-controls,
  .right-column,
  .model-note,
  .model-note-grid {
    grid-template-columns: 1fr;
  }

  .floating-controls > .section-heading,
  .floating-controls > .control-panel-body,
  .space-card,
  .image-credit {
    grid-column: auto;
  }

  .live-readout {
    max-width: 48%;
  }

  .live-readout strong {
    font-size: 0.75rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
