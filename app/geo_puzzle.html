        /* 加上 touch-action: none; 防止拖曳方塊時觸發頁面滾動 */
        .draggable-item { cursor: grab; transition: all 0.2s ease; user-select: none; touch-action: none; }
        .draggable-item:active { cursor: grabbing; transform: scale(1.05); z-index: 50; }
        .dragging { opacity: 0.4; background-color: #e2e8f0; border: 2px dashed #3b82f6; }

        .confetti { position: absolute; width: 8px; height: 8px; pointer-events: none; z-index: 100; }

        let currentAddressObj = null;
        let currentAddress = [];
        let shuffledItems = [];

        const container = document.getElementById('address-slots');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const modalMapBtn = document.getElementById('modal-map-btn');
        const typeTag = document.getElementById('address-type-tag');
        const modal = document.getElementById('feedback-modal');
        const modalContent = document.getElementById('modal-content');

        function initGame() {
            const randomIndex = Math.floor(Math.random() * addressData.length);
            currentAddressObj = addressData[randomIndex];
            currentAddress = [...currentAddressObj.full];
            
            let typeLabel = `類型：${currentAddressObj.type}`;
            if (currentAddressObj.display) {
                typeLabel += ` (${currentAddressObj.display})`;
            }
            typeTag.textContent = typeLabel;
            
            shuffledItems = [...currentAddress];
            shuffle(shuffledItems);

            while (shuffledItems.length > 1 && shuffledItems.join('') === currentAddress.join('')) {
                shuffle(shuffledItems);
            }

            renderItems();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderItems() {
            container.innerHTML = '';
            shuffledItems.forEach((text) => {
                const div = document.createElement('div');
                div.className = 'draggable-item px-4 py-3 bg-white border-2 border-slate-200 rounded-xl shadow-sm text-sm md:text-base font-bold text-slate-700 hover:border-indigo-400 hover:text-indigo-600 transition-all active:scale-105';
                div.textContent = text;
                div.draggable = true;
                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragend', handleDragEnd);
                container.appendChild(div);
            });
            container.addEventListener('dragover', handleDragOver);
        }

        let dragSrcEl = null;
        function handleDragStart(e) { this.classList.add('dragging'); dragSrcEl = this; e.dataTransfer.effectAllowed = 'move'; }
        function handleDragEnd(e) { this.classList.remove('dragging'); }
        function handleDragOver(e) {
            e.preventDefault();
            const draggable = document.querySelector('.dragging');
            if (!draggable) return;
            const afterElement = getDragAfterElement(container, e.clientX, e.clientY);
            if (afterElement == null) { container.appendChild(draggable); } 
            else { container.insertBefore(draggable, afterElement); }
        }

        function getDragAfterElement(container, x, y) {
            const draggableElements = [...container.querySelectorAll('.draggable-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offsetX = x - box.left - box.width / 2;
                const offsetY = y - box.top - box.height / 2;
                if (Math.abs(offsetY) < box.height && offsetX < 0 && offsetX > closest.offset) {
                    return { offset: offsetX, element: child };
                } else { return closest; }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // ================= Google Map 搜尋邏輯優化 =================
        modalMapBtn.addEventListener('click', () => {
            // 邏輯：過濾掉容易導致搜尋失敗的鄰、里、村組件
            // 保留：縣市、區鄉鎮、路、段、巷、弄、號、樓
            const filteredAddress = currentAddress.filter(part => {
                // 如果字尾是里、鄰、村，則排除 (排除地標名稱中的里鄰村除外)
                const isAdministrativeUnit = /[里鄰村]$/.test(part);
                return !isAdministrativeUnit;
            });

            // 如果有地標名稱，則將地標名稱置於搜尋首位
            let query = "";
            if (currentAddressObj.display) {
                query = `${currentAddressObj.display} ${filteredAddress.join('')}`;
            } else {
                query = filteredAddress.join('');
            }
            
            const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
            window.open(url, '_blank');
        });

        checkBtn.addEventListener('click', () => {
            const items = [...container.querySelectorAll('.draggable-item')];
            const currentOrder = items.map(el => el.textContent);
            const isCorrect = currentOrder.join('') === currentAddress.join('');
            showModal(isCorrect);
        });

        nextBtn.addEventListener('click', () => { initGame(); });

        function showModal(isCorrect) {
            const icon = document.getElementById('status-icon');
            const title = document.getElementById('status-title');
            const msg = document.getElementById('status-msg');
            
            if (isCorrect) {
                icon.textContent = '🎉';
                title.textContent = '完全正確！';
                title.className = 'text-2xl font-bold mb-2 text-emerald-600';
                msg.textContent = '地名階層排列完美！現在可以去地圖看看實景喔。';
                modalMapBtn.classList.remove('hidden');
                createConfetti();
            } else {
                icon.textContent = '🧐';
                title.textContent = '還差一點點';
                title.className = 'text-2xl font-bold mb-2 text-orange-500';
                msg.textContent = '順序好像不太對喔，再檢查一下範圍大小吧！';
                modalMapBtn.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            setTimeout(() => { modalContent.classList.remove('scale-0'); modalContent.classList.add('scale-100'); }, 10);
        }

        function closeModal() {
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (document.getElementById('status-title').textContent === '完全正確！') initGame();
            }, 300);
        }

        function createConfetti() {
            const colors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#ec4899'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(confetti);
                confetti.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${(Math.random() - 0.5) * 300}px, 100vh, 0) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], { duration: 2500 + Math.random() * 1500, easing: 'cubic-bezier(0, .9, .57, 1)' }).onfinish = () => confetti.remove();
            }
        }

        // 初始化觸控拖曳 Polyfill，讓手機也能完美支援原生拖曳事件
        MobileDragDrop.polyfill({
            dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
        });
        
        // 配合 Polyfill，防止在拖曳時意外滾動頁面
        window.addEventListener('touchmove', function() {}, {passive: false});

        initGame();
