<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>河流的侵蝕、搬運與堆積模擬</title>
  <style>
    /* ==========================================================================
       全域重置與單頁滿版防溢出設定 (100vw x 100dvh, overflow: hidden)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --header-h: 48px;
      --bg-sky-top: #e8f2fc;
      --bg-sky-bot: #d5e5f5;
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.95);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --blue-main: #0284c7;
      --blue-dark: #0369a1;
      --amber-main: #d97706;
      --emerald-main: #059669;
      --panel-shadow: 0 8px 28px rgba(15, 23, 42, 0.13);
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: linear-gradient(170deg, var(--bg-sky-top) 0%, var(--bg-sky-bot) 100%);
      color: var(--text-primary);
    }

    /* ==========================================================================
       1. 精簡頂部標題與清晰控制列 (高度 48px，按鈕高度 36px 易觸控)
       ========================================================================== */
    .topbar {
      width: 100%;
      height: var(--header-h);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.28);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      position: relative;
      z-index: 30;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-text-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0ea5e9, #0369a1);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
    }

    .brand-title {
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      white-space: nowrap;
    }

    @media (max-width: 960px) {
      .brand-sub {
        display: none;
      }
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tool-btn {
      height: 36px;
      padding: 0 11px;
      border-radius: 9px;
      border: 1px solid rgba(148, 163, 184, 0.38);
      background: #ffffff;
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.16s ease;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    .tool-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .tool-btn:active {
      transform: scale(0.97);
    }

    .tool-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .tool-btn.is-active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }

    .tool-btn.btn-download {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #0369a1;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.28);
    }

    .tool-btn.btn-download:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
    }

    /* ==========================================================================
       2. 主模擬畫布容器與浮動面板佈局
       ========================================================================== */
    .stage-wrap {
      position: relative;
      width: 100%;
      height: calc(100dvh - var(--header-h));
      overflow: hidden;
    }

    #simCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    #simCanvas:active {
      cursor: grabbing;
    }

    /* 左上角：地質作用即時觀測卡片 */
    .telemetry-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 248px;
      padding: 11px 13px;
      border-radius: 14px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--panel-shadow);
      z-index: 20;
      pointer-events: auto;
    }

    .telemetry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 9px;
    }

    .telemetry-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      flex-shrink: 0;
    }

    .status-dot.paused {
      background: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }

    .turbidity-pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      white-space: nowrap;
    }

    .stat-item {
      margin-bottom: 7px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    .stat-num {
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .bar-bg {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.24);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .science-note {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      font-size: 11px;
      line-height: 1.45;
      color: #334155;
      font-weight: 500;
    }

    /* 右上角：畫面縮放控制工具列 (支援放大、縮小與一鍵恢復 100%) */
    .zoom-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--panel-shadow);
      z-index: 21;
    }

    .zoom-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: #ffffff;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .zoom-btn:hover {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }

    .zoom-btn:active {
      transform: scale(0.95);
    }

    .zoom-reset-btn {
      min-width: 50px;
      height: 34px;
      padding: 0 7px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: rgba(241, 245, 249, 0.85);
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .zoom-reset-btn:hover {
      background: #e0f2fe;
      color: #0369a1;
    }

    /* 底部浮動控制面板：情境預設、放大鏡快速定位與雙滑桿 */
    .control-panel {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: min(760px, calc(100vw - 24px));
      padding: 10px 14px 12px;
      border-radius: 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--panel-shadow);
      z-index: 22;
    }

    .chip-bar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 14px;
      margin-bottom: 9px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
    }

    .chip-section {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .chip-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .chip-btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.42);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-primary);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip-btn:hover {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }

    .chip-btn:active {
      transform: scale(0.96);
    }

    .sliders-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .slider-box {
      background: rgba(248, 250, 252, 0.78);
      border: 1px solid rgba(203, 213, 225, 0.65);
      border-radius: 11px;
      padding: 7px 11px;
    }

    .slider-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
    }

    .slider-name {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .slider-val {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .val-rain {
      background: #e0f2fe;
      color: #0369a1;
    }

    .val-slope {
      background: #fef3c7;
      color: #b45309;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #cbd5e1;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #0284c7;
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
      cursor: pointer;
    }

    #slopeSlider::-webkit-slider-thumb {
      background: #d97706;
    }

    .slider-scale {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      margin-top: 3px;
      font-weight: 500;
    }

    .toast-msg {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      padding: 7px 15px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 40;
      white-space: nowrap;
    }

    .toast-msg.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 620px) {
      .topbar {
        padding: 0 8px;
      }
      .brand-title {
        font-size: 13.5px;
      }
      .tool-btn .btn-txt {
        display: none;
      }
      .tool-btn {
        width: 36px;
        padding: 0;
      }
      .telemetry-panel {
        width: 210px;
        padding: 8px 10px;
        top: 8px;
        left: 8px;
      }
      .zoom-controls {
        top: 8px;
        right: 8px;
      }
      .science-note {
        display: none;
      }
      .sliders-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- ========================================================================
       1. 精簡頂部標題與控制按鈕列
       ======================================================================== -->
  <header class="topbar">
    <div class="brand-box">
      <div class="brand-icon" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17c3-2 5 2 8 0s5-4 10-2" />
          <path d="M3 11c4-3 6 1 9-1s4-5 9-3" />
          <path d="m14 3 4 4-4 4" />
        </svg>
      </div>
      <div class="brand-text-wrap">
        <h1 class="brand-title">河流的侵蝕、搬運與堆積模擬</h1>
        <span class="brand-sub">空拍斜俯瞰 3D 地質互動實驗</span>
      </div>
    </div>

    <nav class="nav-actions" aria-label="模擬控制工具列">
      <!-- 暫停 / 繼續 -->
      <button id="btnPlayPause" class="tool-btn" type="button" title="暫停或繼續河流作用模擬">
        <svg id="svgPause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16" rx="1" />
          <rect x="14" y="4" width="4" height="16" rx="1" />
        </svg>
        <svg id="svgPlay" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
        <span id="txtPlayPause" class="btn-txt">暫停</span>
      </button>

      <!-- 重置地形 -->
      <button id="btnReset" class="tool-btn btn-reset" type="button" title="重置山谷與河口堆積地形">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        <span class="btn-txt">重置地形</span>
      </button>

      <!-- 放大鏡開關 -->
      <button id="btnMagnifier" class="tool-btn is-active" type="button" title="開啟或關閉光學放大鏡觀察河床顆粒">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="20" y1="20" x2="16.2" y2="16.2" />
        </svg>
        <span class="btn-txt">放大鏡開關</span>
      </button>

      <!-- 地標標籤開關 -->
      <button id="btnLandmarks" class="tool-btn is-active" type="button" title="顯示或隱藏上游、沖積扇、中游與三角洲地標">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        <span class="btn-txt">顯示地標</span>
      </button>

      <!-- 下載 HTML 檔 -->
      <button id="btnDownload" class="tool-btn btn-download" type="button" title="下載完整單一 HTML 離線教學網頁檔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span class="btn-txt">下載 HTML 檔</span>
      </button>
    </nav>
  </header>

  <!-- ========================================================================
       主 3D 空拍斜俯瞰模擬畫布與浮動控制面板
       ======================================================================== -->
  <main class="stage-wrap" id="stageWrap">
    <canvas id="simCanvas"></canvas>

    <!-- 左上角：即時地質作用指標面板 -->
    <aside class="telemetry-panel" aria-label="即時地形演變數據">
      <div class="telemetry-head">
        <div class="telemetry-title">
          <span id="statusDot" class="status-dot"></span>
          <span>地質作用即時觀測</span>
        </div>
        <span id="turbidityBadge" class="turbidity-pill">水質：適中</span>
      </div>

      <div class="stat-item">
        <div class="stat-row">
          <span>上游侵蝕強度</span>
          <span id="numErosion" class="stat-num">14%</span>
        </div>
        <div class="bar-bg">
          <div id="barErosion" class="bar-fill" style="width: 14%; background: #ef4444;"></div>
        </div>
      </div>

      <div class="stat-item">
        <div class="stat-row">
          <span>河水含沙濁度</span>
          <span id="numTurbidity" class="stat-num">34%</span>
        </div>
        <div class="bar-bg">
          <div id="barTurbidity" class="bar-fill" style="width: 34%; background: #0284c7;"></div>
        </div>
      </div>

      <div class="stat-item" style="margin-bottom: 0;">
        <div class="stat-row">
          <span>下游堆積速率</span>
          <span id="numDeposition" class="stat-num">22%</span>
        </div>
        <div class="bar-bg">
          <div id="barDeposition" class="bar-fill" style="width: 22%; background: #d97706;"></div>
        </div>
      </div>

      <p id="scienceNote" class="science-note">
        侵蝕以上游陡谷為主，泥沙隨水流搬運至平緩下游堆積成三角洲。
      </p>
    </aside>

    <!-- 右上角：畫面放大 / 縮小與視角復原控制列 -->
    <div class="zoom-controls" role="group" aria-label="畫面縮放控制">
      <button id="btnZoomOut" class="zoom-btn" type="button" title="縮小畫面 (或向下滾動滾輪)">−</button>
      <button id="btnZoomReset" class="zoom-reset-btn" type="button" title="恢復預設大小與置中視角">100%</button>
      <button id="btnZoomIn" class="zoom-btn" type="button" title="放大畫面 (或向上滾動滾輪)">+</button>
    </div>

    <!-- 右下角/底部：情境預設、放大鏡快速定位與雙滑桿控制面板 -->
    <section class="control-panel" aria-label="環境參數與放大鏡控制">
      <div class="chip-bar-row">
        <!-- 一鍵情境預設 -->
        <div class="chip-section">
          <span class="chip-label">情境預設：</span>
          <div class="chip-group">
            <button type="button" class="chip-btn preset-trigger" data-rain="20" data-slope="24">日常微流</button>
            <button type="button" class="chip-btn preset-trigger" data-rain="95" data-slope="42">豪雨陡坡</button>
            <button type="button" class="chip-btn preset-trigger" data-rain="35" data-slope="14">平緩堆積</button>
          </div>
        </div>

        <!-- 放大鏡快速定位 -->
        <div class="chip-section">
          <span class="chip-label">放大鏡檢視：</span>
          <div class="chip-group">
            <button type="button" class="chip-btn mag-loc" data-zone="upstream">上游巨石</button>
            <button type="button" class="chip-btn mag-loc" data-zone="midstream">中游卵石</button>
            <button type="button" class="chip-btn mag-loc" data-zone="downstream">下游淤泥</button>
          </div>
        </div>
      </div>

      <!-- 雙滑桿：雨水水量 & 山谷坡度 -->
      <div class="sliders-grid">
        <div class="slider-box">
          <div class="slider-top">
            <label for="rainSlider" class="slider-name">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9" />
                <path d="M16 14v6" />

                <path d="M12 16v6" />

          <div class="slider-scale">

        <div class="slider-box">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
              </svg>

          </div>
          <input id="slopeSlider" type="range" min="12" max="46" value="28" />
          <div class="slider-scale">
            <span>12° 平緩丘陵</span>
